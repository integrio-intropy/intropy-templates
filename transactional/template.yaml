apiVersion: intropy.io/v1
kind: Template
metadata:
  name: transactional
  title: Transactional Integration
  description: .NET job that polls a local source folder, publishes via in-memory Dapr pub/sub, and writes the transformed result to a local destination folder.
  tags:
    - example
    - dotnet
    - dapr
    - transactional
  labels:
    intropy.io/template-level: example
    intropy.io/block-kind: transactional-integration
    intropy.io/data-flow: "both"

spec:
  parameters:
    type: object
    required:
      - name
      - organization
    properties:
      name:
        type: string
        title: Project name
        description: PascalCase identifier used for the .NET project, root namespace, and assembly. Dot-separated segments are allowed for nested namespaces (e.g. OrderSync or Int1055.OrderSync).
        pattern: "^[A-Z][A-Za-z0-9]*(\\.[A-Z][A-Za-z0-9]*)*$"
      organization:
        type: string
        title: Organization
        description: PascalCase name of the organization the integration runs for. Becomes the telemetry ServiceNamespace and the business-incident source URN (urn:<organization>:<component>).
        pattern: "^[A-Z][A-Za-z0-9]*$"
      idempotencyAppId:
        type: string
        title: Idempotency service app-id
        description: Dapr app-id of the Idempotency Service. The default matches the platform-services deployment. Only wired when empty is false.
        default: "idempotency-service.services"
      businessIncidentsAppId:
        type: string
        title: Business incident service app-id
        description: Dapr app-id of the Business Incident Service. The default matches the platform-services deployment. Only wired when empty is false.
        default: "business-incident-service.services"
      sourcePort:
        type: string
        title: Source port
        description: Name of the port the integration sweeps, as the system host declares it. Empty derives <app-id>-source; name a port the system already has to share it.
        default: ""
        pattern: "^([a-z][a-z0-9-]*)?$"
      destinationPort:
        type: string
        title: Destination port
        description: Name of the port the send pipeline writes to, as the system host declares it. Empty derives <app-id>-destination; name a port the system already has to share it.
        default: ""
        pattern: "^([a-z][a-z0-9-]*)?$"
      claimCheck:
        type: boolean
        title: Claim check
        description: Register a claim store, so a file too large for a queue message is kept there while a pointer travels instead. The environment must then provide the store's binding and its ClaimStore settings.
        default: false
      empty:
        type: boolean
        title: Empty bodies
        description: When true, strip sample business logic from pipeline step bodies and omit the idempotency/business-incident service wiring. The resulting project compiles and starts under Dapr, but every step throws NotImplementedException so a migration agent can fill them in.
        default: false
  values:
    appId: '{{ .name | kebabcase | replace "." "-" }}'
    # The component's .NET project name, recorded in .intropy/scaffold.json
    # for workspace-level tooling (e.g. solution file assembly).
    projectName: '{{ .name }}'
    # The integration's source and destination ports — the named interfaces
    # it reads and writes the outside world through: the sourcePort and
    # destinationPort parameters, or derived like appId so they stay unique
    # per component. Recorded in .intropy/scaffold.json;
    # `intropy sys create` reads them back to declare the component's
    # From/To ports in the system host, whose development definition
    # resolves each to a local folder by default (external system and
    # transport are never asked for at scaffold time).
    fromPort: '{{ default (printf "%s-source" (.name | kebabcase | replace "." "-")) .sourcePort }}'
    toPort: '{{ default (printf "%s-destination" (.name | kebabcase | replace "." "-")) .destinationPort }}'
