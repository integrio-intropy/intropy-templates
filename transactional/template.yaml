apiVersion: intropy.io/v1
kind: Template
metadata:
  name: transactional
  title: Transactional Integration
  description: .NET job that reads its source once per run (a folder's files, or a SQL query's new rows), queues each read on an internal Dapr pub/sub topic, and writes the transformed result to its destination port.
  tags:
    - example
    - dotnet
    - dapr
    - transactional
  labels:
    intropy.io/template-level: example
    intropy.io/block-kind: transactional-integration
    intropy.io/data-flow: "both"

spec:
  parameters:
    type: object
    required:
      - name
      - organization
    properties:
      name:
        type: string
        title: Project name
        description: PascalCase identifier used for the .NET project, root namespace, and assembly. Dot-separated segments are allowed for nested namespaces (e.g. OrderSync or Int1055.OrderSync).
        pattern: "^[A-Z][A-Za-z0-9]*(\\.[A-Z][A-Za-z0-9]*)*$"
      organization:
        type: string
        title: Organization
        description: PascalCase name of the organization the integration runs for. Becomes the telemetry ServiceNamespace and the business-incident source URN (urn:<organization>:<component>).
        pattern: "^[A-Z][A-Za-z0-9]*$"
      source:
        type: string
        title: Source
        description: What the integration reads. "file" sweeps a folder through a Dapr binding; "sql" queries a database for the rows after a watermark it keeps between runs.
        enum: [file, sql]
        default: file
      idempotencyAppId:
        type: string
        title: Idempotency service app-id
        description: Dapr app-id of the Idempotency Service. The default matches the platform-services deployment. Wired when empty is false or source is sql.
        default: "idempotency-service.services"
      businessIncidentsAppId:
        type: string
        title: Business incident service app-id
        description: Dapr app-id of the Business Incident Service. The default matches the platform-services deployment. Only wired when empty is false.
        default: "business-incident-service.services"
      empty:
        type: boolean
        title: Empty bodies
        description: When true, strip sample business logic from pipeline step bodies and omit the idempotency/business-incident service wiring. The resulting project compiles and starts under Dapr, but every step throws NotImplementedException so a migration agent can fill them in.
        default: false
  values:
    appId: '{{ .name | kebabcase | replace "." "-" }}'
    # The component's .NET project name, recorded in .intropy/scaffold.json
    # for workspace-level tooling (e.g. solution file assembly).
    projectName: '{{ .name }}'
    # The integration's source and destination ports — the named interfaces
    # it reads and writes the outside world through. Derived like appId so
    # they stay unique per component. Recorded in .intropy/scaffold.json;
    # `intropy sys create` reads them back to declare the component's
    # From/To ports in the system host, whose development definition
    # resolves each to a local folder by default (external system and
    # transport are never asked for at scaffold time).
    fromPort: '{{ .name | kebabcase | replace "." "-" }}-source'
    toPort: '{{ .name | kebabcase | replace "." "-" }}-destination'
    # How the system reaches the source port, recorded in .intropy/scaffold.json:
    # `intropy sys create` declares an external port (a database, an HTTP API)
    # with PortRef.DefineExternal, no binding and no folder. The destination
    # port is always a binding.
    fromPortKind: '{{ if eq .source "file" }}binding{{ else }}external{{ end }}'
    # The SQL source ships empty bodies only: its sample is the query, not a
    # business model. Refused up front rather than rendering a half sample.
    sourceCheck: '{{ if and (eq .source "sql") (not .empty) }}{{ fail "source=sql renders empty step bodies only; scaffold it with empty=true" }}{{ end }}'
    # The Dapr state store the SQL source keeps its watermark in. The topology
    # mints it under this name for every component that reads an external
    # port, and the host passes it as Ports__<port>__CursorStore; the
    # Development settings repeat it for runs and tests outside the host.
    cursorStore: '{{ .name | kebabcase | replace "." "-" }}-cursors'
  files:
    # The query exists only for a SQL source; the folder sweep's receive-side
    # tests only for a file source, the watermark's only for a SQL one.
    - path: src/Sql/**
      when: '{{ eq .source "sql" }}'
    - path: "test/*/ReceiveSideIntegrationTests.cs.tmpl"
      when: '{{ eq .source "file" }}'
    - path: "test/*/SqlReceiveTests.cs.tmpl"
      when: '{{ eq .source "sql" }}'
