apiVersion: intropy.dev/v1
kind: Template
metadata:
  name: transactional
  title: Transactional Integration
  description: .NET job that polls a local source folder, publishes via in-memory Dapr pub/sub, and writes the transformed result to a local destination folder.
  tags:
    - example
    - dotnet
    - dapr
    - transactional
  labels:
    intropy.io/template-level: example
    intropy.dev/block-kind: transactional-integration
    intropy.dev/data-flow: "both"

spec:
  parameters:
    type: object
    required:
      - name
      - organization
    properties:
      name:
        type: string
        title: Project name
        description: PascalCase identifier used for the .NET project, root namespace, and assembly. Dot-separated segments are allowed for nested namespaces (e.g. OrderSync or Int1055.OrderSync).
        pattern: "^[A-Z][A-Za-z0-9]*(\\.[A-Z][A-Za-z0-9]*)*$"
      organization:
        type: string
        title: Organization
        description: PascalCase name of the organization the integration runs for. Becomes the telemetry ServiceNamespace and the business-incident source URN (urn:<organization>:<component>).
        pattern: "^[A-Z][A-Za-z0-9]*$"
      empty:
        type: boolean
        title: Empty bodies
        description: When true, strip sample business logic from pipeline step bodies and omit the idempotency/business-incident service wiring. The resulting project compiles and starts under Dapr, but every step throws NotImplementedException so a migration agent can fill them in.
        default: false
  values:
    appId: '{{ .name | kebabcase | replace "." "-" }}'
    # The component's .NET project name, recorded in .intropy/scaffold.json
    # for workspace-level tooling (e.g. solution file assembly).
    projectName: '{{ .name }}'
    # The integration's source and destination connectors — the local ports
    # it reads and writes the outside world through. Derived like appId so
    # they stay unique per component. Recorded in .intropy/scaffold.json;
    # `intropy sys create` reads them back to declare the component's
    # From/To connectors in the system host, whose development definition
    # resolves each to a local folder by default (external system and
    # transport are never asked for at scaffold time).
    fromConnector: '{{ .name | kebabcase | replace "." "-" }}-source'
    toConnector: '{{ .name | kebabcase | replace "." "-" }}-destination'
    # The component-owned internal hop: the receive side publishes each
    # source file for the send side to process. Deliberately not recorded in
    # scaffold.json — the topic is invisible to the topology, but it must
    # stay unique per component so two transactional integrations under one
    # host never cross wires.
    internalTopic: '{{ .name | kebabcase | replace "." "-" }}-in'
