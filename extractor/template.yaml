apiVersion: intropy.io/v1
kind: Template
metadata:
  name: extractor
  title: Extractor Integration
  description: Run-to-completion .NET extractor that sweeps a local source folder once per run, runs each file through the Intropy extractor pipeline, and publishes the result as a CloudEvent to a Dapr pub/sub topic.
  tags:
    - example
    - dotnet
    - dapr
    - extractor
  labels:
    intropy.io/template-level: example
    intropy.io/block-kind: extractor
    intropy.io/data-flow: "in"
    # Names the parameter --publishes seeds with the message it resolves.
    # Declaring it is what makes the flag usable against this template.
    intropy.io/message-params: message

spec:
  parameters:
    type: object
    required:
      - name
      - organization
      - contract
    properties:
      name:
        type: string
        title: Project name
        description: PascalCase identifier used for the .NET project, root namespace, and assembly. Dot-separated segments are allowed for nested namespaces (e.g. OrderExtractor or Int1055.OrderExtractor).
        pattern: "^[A-Z][A-Za-z0-9]*(\\.[A-Z][A-Za-z0-9]*)*$"
      organization:
        type: string
        title: Organization
        description: PascalCase name of the organization the integration runs for. Becomes the telemetry ServiceNamespace and the business-incident source URN (urn:<organization>:<component>).
        pattern: "^[A-Z][A-Za-z0-9]*$"
      message:
        type: string
        title: Message
        description: Id of the message the extractor publishes, seeded by `--publishes` from the registry. It is the CloudEvent type, and — with no topic — the topic name `intropy sys create` assembles the publication on.
        pattern: "^([A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$"
        default: ""
      topic:
        type: string
        title: Topic
        description: The pub/sub topic the extractor publishes to. Leave it unset when a message is wired; set it to publish on a topic named independently of the message.
        pattern: "^([a-z][a-z0-9-]*)?$"
        default: ""
      contract:
        type: string
        title: Contract type
        description: PascalCase name of the shared-contracts record the topic carries — the other half of the system contract, recorded in .intropy/scaffold.json for `intropy sys create` to type the topic with. The sample logic uses Order.
        pattern: "^[A-Z][A-Za-z0-9]*$"
      idempotencyAppId:
        type: string
        title: Idempotency service app-id
        description: Dapr app-id of the Idempotency Service. The default matches the platform-services deployment.
        default: "idempotency-service.services"
      businessIncidentsAppId:
        type: string
        title: Business incident service app-id
        description: Dapr app-id of the Business Incident Service. The default matches the platform-services deployment.
        default: "business-incident-service.services"
      eventSource:
        type: string
        title: CloudEvent source
        description: Envelope `source` (URI) for published events. The default derives as urn:<organization>:<app-id>; set it to preserve an existing event identity during a migration.
        default: ""
      eventType:
        type: string
        title: CloudEvent type
        description: Envelope `type` for published events. The default derives as <organization-lower>.<first-topic-segment>.<last-topic-segment>; set it to preserve an existing event identity during a migration. A wired message is the registry's own type and outranks this.
        default: ""
      empty:
        type: boolean
        title: Empty bodies
        description: When true, strip sample business logic from pipeline step bodies. The resulting project compiles and starts under Dapr, but every step throws NotImplementedException so a migration agent can fill them in. The idempotency and business-incident wiring stays (the extractor pipeline requires it) with throwing extractor lambdas to replace.
        default: true
  values:
    appId: '{{ .name | kebabcase | replace "." "-" }}'
    # The component's .NET project name, recorded in .intropy/scaffold.json
    # for workspace-level tooling (e.g. solution file assembly).
    projectName: '{{ .name }}'
    # Name of the sibling shared-contracts project; also drives the dependency
    # output below and the ProjectReference in the skeleton csproj. Plain
    # "Contracts" on purpose: the project is scoped to the system directory it
    # lives in, not to the organization.
    contracts: 'Contracts'
    # The pub/sub component name the skeleton publishes through
    # (Constants.cs). Recorded in .intropy/scaffold.json for
    # `intropy sys create`, together with the contract parameter above.
    # A registry-resolved publication brings its own component name in the
    # publishes block; `pubsub` is the system-independent default every
    # internal publication uses.
    pubsub: '{{ if and (hasKey . "publishes") (hasKey .publishes "pubsub") }}{{ .publishes.pubsub }}{{ else }}pubsub{{ end }}'
    # The topic the extractor publishes on, resolved once so Constants.cs and
    # the docs can never disagree. A publishes block decides alone — its
    # topic, or, for an internal publication that carries none, the
    # message-name convention `intropy sys create` assembles the channel
    # with; the block never merges with the topic parameter, matching how the
    # CLI reads a record. Without a block: the topic parameter, then the
    # message parameter under the same convention. Neither is a scaffold with
    # no channel at all, which fails here rather than rendering an empty
    # topic name.
    topicName: '{{ if hasKey . "publishes" }}{{ if hasKey .publishes "topic" }}{{ .publishes.topic }}{{ else if hasKey .publishes "message" }}{{ .publishes.message }}{{ else }}{{ fail "the publishes block declares neither a topic nor a message" }}{{ end }}{{ else if .topic }}{{ .topic }}{{ else if .message }}{{ .message }}{{ else }}{{ fail "no channel to publish on: pass --publishes <message-ref>, or set message=<message-id>, or set topic=<topic>" }}{{ end }}'
    # The message the extractor publishes, empty when none is wired. The
    # block is the authority; the parameter carries the same value on the flag
    # path (the flag seeds it) and stands alone when a message is set by hand.
    messageId: '{{ if and (hasKey . "publishes") (hasKey .publishes "message") }}{{ .publishes.message }}{{ else if .message }}{{ .message }}{{ end }}'
    # The schema pin a registry-resolved publication carries: the immutable
    # URL of the message's default schema version at resolve time. Rendered
    # into the docs, never used to generate types — that is an external
    # tool's job. Named apart from the block's own dataschema/dataschemaurl
    # keys, which stay the CLI's to write.
    schemaUrl: '{{ if and (hasKey . "publishes") (hasKey .publishes "dataschemaurl") }}{{ .publishes.dataschemaurl }}{{ end }}'
    # The extractor's source port — the named interface it reads the outside
    # world through. Derived like appId so it stays unique per component.
    # Recorded in .intropy/scaffold.json; `intropy sys create` resolves it to
    # a local file transport by default (external system and transport are
    # never asked for at scaffold time).
    port: '{{ .name | kebabcase | replace "." "-" }}-source'
    # CloudEvent identity: a wired message is the type; failing that the
    # eventType/eventSource parameters preserve an existing identity during a
    # migration; failing those the type derives from the topic
    # (<org>.<first>.<last> of the kebab topic, e.g. product-export ->
    # maxbo.product.export). Empty when there is no topic to derive from — the
    # message branch owns that case.
    eventSourceValue: '{{ printf "urn:%s:%s" .organization (.name | kebabcase) }}'
    eventTypeValue: '{{ if .topic }}{{ printf "%s.%s.%s" (.organization | lower) (index (regexSplit "-" .topic -1) 0) (index (regexSplit "-" .topic -1) (sub (len (regexSplit "-" .topic -1)) 1)) }}{{ end }}'
  dependencies:
    - template: shared-contracts
      output: '{{ .contracts }}'
      values:
        name: '{{ .contracts }}'
        contract: '{{ .contract }}'
        empty: '{{ .empty }}'
