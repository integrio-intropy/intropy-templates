openapi: 3.0.3
info:
  title: Business Incident Service
  version: 1.0.0
paths:
  /events:
    post:
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              type: object
            examples:
              accepted:
                value:
                  specversion: '1.0'
                  id: example-incident
                  source: urn:intropy:mock
                  type: intropy.business-incident
                  data: {}
      responses:
        '202':
          description: Event accepted.
          x-microcks-refs:
            - accepted
