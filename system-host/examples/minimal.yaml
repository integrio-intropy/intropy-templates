# Render fixture: the full value payload, as `intropy sys create` assembles it
# from the tutorial's order-flow workspace (one extractor, one loader, one
# transactional integration, the shared Contracts project). The payload
# parameters are required and pre-joined: each component carries the
# Topics/Connectors field identifiers it touches, and sharedContracts.include
# is the ProjectReference path from the host's output directory to the
# contracts csproj.
#   intropy int create system-host -o /tmp/system-host-out -f system-host/examples/minimal.yaml --version main --no-input
name: order-flow
topics:
  - pubsub: pubsub
    name: orders
    contract: Order
    field: Orders
connectors:
  - name: erp-destination
    field: ErpDestination
  - name: erp-source
    field: ErpSource
  - name: order-extractor-source
    field: OrderExtractorSource
  - name: order-loader-destination
    field: OrderLoaderDestination
components:
  - appId: order-extractor
    kind: extractor
    topicField: Orders
    connectorField: OrderExtractorSource
  - appId: order-loader
    kind: loader
    topicField: Orders
    connectorField: OrderLoaderDestination
  # A transactional integration: connector-to-connector, no topic. Its wiring
  # fields follow its shape — fromField/toField instead of topicField.
  - appId: erp-sync
    kind: transactional-integration
    fromField: ErpSource
    toField: ErpDestination
sharedContracts:
  name: Contracts
  include: ../Contracts/Contracts.csproj
