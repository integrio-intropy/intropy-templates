apiVersion: intropy.io/v1
kind: Template
metadata:
  name: shared-contracts
  title: Shared Contracts
  description: Class library holding the contract types shared by the components of an integration system — scaffolded once as a sibling of the first component template that declares it as a dependency, and referenced by every component via a ProjectReference.
  tags:
    - example
    - dotnet
    - shared
  labels:
    intropy.io/template-level: example
    intropy.io/template-role: shared-library

spec:
  parameters:
    type: object
    required:
      - name
    properties:
      name:
        type: string
        title: Project name
        description: PascalCase identifier used for the .NET project, root namespace, and assembly. Dot-separated segments are allowed. Component templates conventionally pass plain "Contracts" — the project is scoped by the system directory it lives in, so it needs no organization prefix.
        pattern: "^[A-Z][A-Za-z0-9]*(\\.[A-Z][A-Za-z0-9]*)*$"
      contract:
        type: string
        title: Contract type
        description: PascalCase name of the canonical payload type the system's messages are typed with — the record this library is scaffolded around. Component templates pass their derived payload type down.
        pattern: "^[A-Z][A-Za-z0-9]*$"
        default: Order
      contracts:
        type: array
        title: More contract types
        description: Further payload-type records to scaffold beside contract — one per message a component routes (a loader with several routes passes all of its payload types). A record already in the library is left as it is.
        items:
          type: string
          pattern: "^[A-Z][A-Za-z0-9]*$"
      empty:
        type: boolean
        title: Empty bodies
        description: When true, strip the sample payload-type fields. The library still compiles (the payload-type record stays as an empty shell for pipeline generics) so a migration agent can fill in the real type.
        default: false
  files:
    # One more record per element of contracts, rendered from the same shape
    # as {{ .contract }}.cs (keep the two in step).
    - path: "{{ .payload }}.cs.tmpl"
      each: contracts
      as: payload
