apiVersion: intropy.io/v1
kind: Template
metadata:
  name: loader
  title: Loader Integration
  description: Long-running ASP.NET loader that subscribes to a Dapr pub/sub topic over HTTP delivery, runs each delivered message through the Intropy loader pipeline, and writes the result through a local destination folder binding.
  tags:
    - example
    - dotnet
    - dapr
    - loader
  labels:
    intropy.io/template-level: example
    intropy.io/block-kind: loader
    intropy.io/data-flow: "out"
    # Names the parameter --subscribe seeds with the message it resolves.
    # Declaring it is what makes the flag usable against this template.
    intropy.io/message-params: message

spec:
  parameters:
    type: object
    required:
      - name
      - organization
      - contract
    properties:
      name:
        type: string
        title: Project name
        description: PascalCase identifier used for the .NET project, root namespace, and assembly. Dot-separated segments are allowed for nested namespaces (e.g. OrderLoader or Int1055.OrderLoader).
        pattern: "^[A-Z][A-Za-z0-9]*(\\.[A-Z][A-Za-z0-9]*)*$"
      organization:
        type: string
        title: Organization
        description: PascalCase name of the organization the integration runs for. Becomes the telemetry ServiceNamespace and the business-incident source URN (urn:<organization>:<component>).
        pattern: "^[A-Z][A-Za-z0-9]*$"
      message:
        type: string
        title: Message
        description: Id of the message the loader consumes, seeded by `--subscribe` from the registry. With no topic it is also the topic name `intropy sys create` resolves the subscription to.
        pattern: "^([A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$"
        default: ""
      topic:
        type: string
        title: Topic
        description: The pub/sub topic the loader subscribes to. Leave it unset when a message is wired; set it to subscribe to a topic named independently of the message.
        pattern: "^([a-z][a-z0-9-]*)?$"
        default: ""
      contract:
        type: string
        title: Contract type
        description: PascalCase name of the shared-contracts record the topic carries — the other half of the system contract, recorded in .intropy/scaffold.json for `intropy sys create` to type the topic with. The sample logic uses Order.
        pattern: "^[A-Z][A-Za-z0-9]*$"
      idempotencyAppId:
        type: string
        title: Idempotency service app-id
        description: Dapr app-id of the Idempotency Service. The default matches the platform-services deployment.
        default: "idempotency-service.services"
      businessIncidentsAppId:
        type: string
        title: Business incident service app-id
        description: Dapr app-id of the Business Incident Service. The default matches the platform-services deployment.
        default: "business-incident-service.services"
      empty:
        type: boolean
        title: Empty bodies
        description: When true, strip sample business logic from pipeline step bodies. The resulting project compiles and starts under Dapr, but every step throws NotImplementedException so a migration agent can fill them in. The idempotency and business-incident wiring stays (the loader pipeline requires it); idempotency keys off CloudEvent Subject/Time from the context, so there are no extractor lambdas to stub.
        default: true
  values:
    appId: '{{ .name | kebabcase | replace "." "-" }}'
    # The component's .NET project name, recorded in .intropy/scaffold.json
    # for workspace-level tooling (e.g. solution file assembly).
    projectName: '{{ .name }}'
    # Name of the sibling shared-contracts project; also drives the dependency
    # output below and the ProjectReference in the skeleton csproj. Plain
    # "Contracts" on purpose: the project is scoped to the system directory it
    # lives in, not to the organization.
    contracts: 'Contracts'
    # The pub/sub component name the skeleton subscribes through
    # (Constants.cs). Recorded in .intropy/scaffold.json for
    # `intropy sys create`, together with the contract parameter above.
    # An external subscription brings its own component name in the subscribe
    # block; `pubsub` is the system-independent default every internal
    # subscription uses.
    pubsub: '{{ if and (hasKey . "subscribe") (hasKey .subscribe "pubsub") }}{{ .subscribe.pubsub }}{{ else }}pubsub{{ end }}'
    # The topic the loader subscribes to, resolved once so Constants.cs (topic
    # name and subscription route) and the docs can never disagree. A
    # subscribe block decides alone — its topic, or, for an internal
    # subscription that carries none, the message-name convention `intropy
    # sys create` resolves the channel to; the block never merges with the
    # topic parameter, matching how the CLI reads a record. Without a block:
    # the topic parameter, then the message parameter under the same
    # convention. Neither is a scaffold with no channel at all, which fails
    # here rather than rendering an empty topic name.
    topicName: '{{ if hasKey . "subscribe" }}{{ if hasKey .subscribe "topic" }}{{ .subscribe.topic }}{{ else if hasKey .subscribe "message" }}{{ .subscribe.message }}{{ else }}{{ fail "the subscribe block declares neither a topic nor a message" }}{{ end }}{{ else if .topic }}{{ .topic }}{{ else if .message }}{{ .message }}{{ else }}{{ fail "no channel to subscribe to: pass --subscribe <message-ref>, or set message=<message-id>, or set topic=<topic>" }}{{ end }}'
    # The message the loader consumes, empty when none is wired. The block is
    # the authority; the parameter carries the same value on the flag path
    # (the flag seeds it) and stands alone when a message is set by hand.
    messageId: '{{ if and (hasKey . "subscribe") (hasKey .subscribe "message") }}{{ .subscribe.message }}{{ else if .message }}{{ .message }}{{ end }}'
    # The schema pin an external subscription carries: the immutable URL of
    # the message's default schema version at resolve time. Rendered into the
    # docs, never used to generate types — that is an external tool's job.
    # Named apart from the block's own dataschema/dataschemaurl keys, which
    # stay the CLI's to write.
    schemaUrl: '{{ if and (hasKey . "subscribe") (hasKey .subscribe "dataschemaurl") }}{{ .subscribe.dataschemaurl }}{{ end }}'
    # The loader's destination port — the named interface it writes the
    # outside world through. Derived like appId so it stays unique per
    # component. Recorded in .intropy/scaffold.json; `intropy sys create`
    # resolves it to a local file transport by default (external system and
    # transport are never asked for at scaffold time).
    # True when the message this component wires carries a registry schema, so
    # the contract type in the shared library is generated from that schema
    # rather than hand-written. The sample step bodies read the sample
    # contract's own fields, which a generated shape does not have, so they
    # render the not-implemented form instead — the same one `empty` renders.
    generatedContract: '{{ if and (hasKey . "subscribe") (hasKey .subscribe "dataschemaurl") }}true{{ end }}'
    port: '{{ .name | kebabcase | replace "." "-" }}-destination'
  dependencies:
    - template: shared-contracts
      output: '{{ .contracts }}'
      values:
        name: '{{ .contracts }}'
        contract: '{{ .contract }}'
        empty: '{{ .empty }}'
