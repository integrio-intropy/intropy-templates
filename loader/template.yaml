apiVersion: intropy.io/v1
kind: Template
metadata:
  name: loader
  title: Loader Integration
  description: Long-running loader worker that consumes one Dapr pub/sub topic through the Dapr gRPC app callback, routes each message by its CloudEvent type — and, optionally, a content filter — to its own Intropy loader pipeline, and writes the result through a local destination folder binding.
  tags:
    - example
    - dotnet
    - dapr
    - loader
  labels:
    intropy.io/template-level: example
    intropy.io/block-kind: loader
    intropy.io/data-flow: "out"
    intropy.io/message-params: routes

spec:
  parameters:
    type: object
    required:
      - name
      - organization
      - routes
    properties:
      name:
        type: string
        title: Project name
        description: PascalCase identifier used for the .NET project, root namespace, and assembly. Dot-separated segments are allowed for nested namespaces (e.g. OrderLoader or Int1055.OrderLoader).
        pattern: "^[A-Z][A-Za-z0-9]*(\\.[A-Z][A-Za-z0-9]*)*$"
      organization:
        type: string
        title: Organization
        description: PascalCase name of the organization the integration runs for. Becomes the telemetry ServiceNamespace and the business-incident source URN (urn:<organization>:<component>).
        pattern: "^[A-Z][A-Za-z0-9]*$"
      routes:
        type: array
        title: Routes
        description: The messages this loader handles, in the order the sidecar evaluates them. Each route gets its own typed pipeline; its payload type derives from the message name. A message may appear once.
        minItems: 1
        items:
          type: object
          required:
            - message
          additionalProperties: false
          properties:
            message:
              type: string
              title: Message
              description: Logical name of the message — the CloudEvents type the sidecar routes on.
              pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
            when:
              type: string
              title: Filter
              description: Optional Dapr CEL expression the message's events must also match, over the camelCase payload (e.g. event.data.reason != 'fraud-review'). Events it leaves out are handled as unrouted.
      topic:
        type: string
        title: Topic
        description: The topic the loader consumes. Defaults to the first route's message name; set it when the routed messages share a topic their producers publish on.
        pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
      default:
        type: string
        title: Unrouted messages
        description: What becomes of a message on the topic no route takes — another type, or one a filter leaves out. dead-letter leaves it for the broker's dead-letter queue; ignore acknowledges and drops it.
        enum:
          - dead-letter
          - ignore
        default: dead-letter
      idempotencyAppId:
        type: string
        title: Idempotency service app-id
        description: Dapr app-id of the Idempotency Service. The default matches the platform-services deployment.
        default: "idempotency-service.services"
      businessIncidentsAppId:
        type: string
        title: Business incident service app-id
        description: Dapr app-id of the Business Incident Service. The default matches the platform-services deployment.
        default: "business-incident-service.services"
      empty:
        type: boolean
        title: Empty bodies
        description: When true, strip sample business logic from pipeline step bodies. The resulting project compiles and starts under Dapr, but every step throws NotImplementedException so a migration agent can fill them in. The idempotency and business-incident wiring stays (the loader pipeline requires it); idempotency keys off CloudEvent Subject/Time from the context, so there are no extractor lambdas to stub.
        default: true
  values:
    appId: '{{ .name | kebabcase | replace "." "-" }}'
    # The component's .NET project name, recorded in .intropy/scaffold.json
    # for workspace-level tooling (e.g. solution file assembly).
    projectName: '{{ .name }}'
    # Name of the sibling shared-contracts project; also drives the dependency
    # output below and the ProjectReference in the skeleton csproj. Plain
    # "Contracts" on purpose: the project is scoped to the system directory it
    # lives in, not to the organization.
    contracts: 'Contracts'
    # The payload type the first route's message projects to: PascalCase of
    # the message identity — the record the shared-contracts sibling is
    # created around when this loader is the first component to need it.
    # Every route's payload type is the same projection of its own message
    # (`pascal` in the skeleton); the CLI assembly derives the same values.
    payloadType: '{{ pascal (index .routes 0).message }}'
    # The topic the loader consumes: the topic parameter, else the first
    # route's message name — the topic a producer publishes a message on when
    # it sets no topic of its own. One derivation, so every file agrees.
    channel: '{{ get . "topic" | default (index .routes 0).message }}'
    # The loader's destination port — the named interface it writes the
    # outside world through. Derived like appId so it stays unique per
    # component. Recorded in .intropy/scaffold.json; `intropy sys create`
    # resolves it to a local file transport by default (external system and
    # transport are never asked for at scaffold time).
    port: '{{ .name | kebabcase | replace "." "-" }}-destination'
  # One pipeline per route: everything under a Routes/ directory renders once
  # per element of routes, the element bound as .route.
  files:
    - path: "src/Routes/**"
      each: routes
      as: route
    - path: "test/{{ .name }}.Test.Unit/Routes/**"
      each: routes
      as: route
    - path: "test/{{ .name }}.Test.Integration/Routes/**"
      each: routes
      as: route
  dependencies:
    - template: shared-contracts
      output: '{{ .contracts }}'
      values:
        name: '{{ .contracts }}'
        contract: '{{ .payloadType }}'
        # Every route's payload type, so a loader scaffolded before its
        # producers still finds each route's record in the library.
        contracts: '{{ $types := list }}{{ range .routes }}{{ $types = append $types (pascal .message) }}{{ end }}{{ toJson $types }}'
        empty: '{{ .empty }}'
